<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
<title>Mixer de Áudio</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--fg:#1a1a1a;--dim:#605e5c;--line:#e1dfdd;--accent:#0067c0;--accent-fg:#fff;--btn:#ececec;--warn:#9d5d00;--warn-bg:#fff4ce;--err:#c42b1c}
@media (prefers-color-scheme:dark){:root{--bg:#202020;--card:#2b2b2b;--fg:#f3f3f3;--dim:#b3b0ad;--line:#3d3d3d;--accent:#4cc2ff;--accent-fg:#003a5c;--btn:#3a3a3a;--warn:#fce100;--warn-bg:#433519;--err:#ff99a4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
[hidden]{display:none!important}
h1{font-size:20px;margin:16px 0 12px}
button{font:inherit;color:inherit;background:var(--btn);border:0;border-radius:8px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(.92)}
button.on{background:var(--accent);color:var(--accent-fg)}
#banner{position:sticky;top:0;z-index:5;margin:0 -16px 8px;padding:10px 16px;background:var(--warn-bg);color:var(--warn);font-weight:600;text-align:center}
#pair{padding-top:8vh}
#pair p{color:var(--dim)}
#code{width:100%;font:600 32px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.3em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-height:56px}
#code:focus{outline:0;border-color:var(--accent)}
#go{width:100%;margin-top:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;min-height:52px}
#go:disabled{opacity:.5}
#perr{color:var(--err);min-height:1.4em;margin:12px 0 0}
#outs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
#outs button{flex:1 1 0;min-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 8px;min-height:60px}
#outs .g{font-size:22px;line-height:1}
#outs .n{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:10px}
.ico{width:32px;height:32px;border-radius:6px;flex:none;object-fit:contain;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:18px}
.name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{font-size:20px;flex:none}
.mute.muted{background:var(--accent);color:var(--accent-fg)}
.sl{display:flex;align-items:center;gap:12px;margin-top:4px}
input[type=range]{flex:1;min-width:0;height:44px;margin:0;accent-color:var(--accent);touch-action:pan-y}
.val{width:3ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.routes{display:flex;flex-wrap:nowrap;gap:6px;margin-top:6px}
.routes button{flex:1 1 0;min-width:0;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.routes .rg{flex:none}
.routes .rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.off{opacity:.55}
#empty{color:var(--dim);text-align:center;margin:24px 0}
.media{display:flex;align-items:center;gap:6px;margin-top:6px}
.media button{flex:none;width:44px;font-size:18px;padding:0}
.media button:disabled{opacity:.4}
.mt{flex:1;min-width:0;margin-left:4px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{color:var(--dim);font-size:13px;margin:4px 0 2px}
</style>
</head>
<body>
<div id="banner" hidden>Reconectando…</div>

<main id="pair" hidden>
  <h1>Mixer de Áudio</h1>
  <p>Digite o código de 6 dígitos que aparece nas Configurações do app, no PC.</p>
  <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="Código de 6 dígitos">
  <button id="go" disabled>Conectar</button>
  <p id="perr" role="alert"></p>
</main>

<main id="mixer" hidden>
  <h1>Mixer de Áudio</h1>
  <div id="outs" role="group" aria-label="Saída de áudio"></div>
  <div class="card" id="master">
    <div class="top"><span class="ico">🔊</span><span class="name">Volume geral</span>
      <button class="mute" id="mm" aria-label="Mudo geral">🔊</button></div>
    <div class="sl"><input type="range" id="ms" min="0" max="100" step="1" aria-label="Volume geral"><span class="val" id="mv">0</span></div>
  </div>
  <div id="apps"></div>
  <p id="empty" hidden>Nenhum app com som no momento.</p>
</main>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var G={'':'🎧','':'🔊','':'🖥️'};
var S=null, ws=null, opened=false, timer=null, screen='', hold={}, last={}, pend={}, rows={}, sig={};

function show(which){
  screen=which;
  $('pair').hidden=which!=='pair';
  $('mixer').hidden=which!=='mixer';
  if(which==='pair'){$('banner').hidden=true;}
}
function banner(on,text){var b=$('banner');b.hidden=!on;if(text)b.textContent=text;}

/* ---------- conexão ---------- */
function connect(){
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  clearTimeout(timer);timer=null;
  opened=false;
  var s;
  try{s=new WebSocket('ws://'+location.host+'/ws');}catch(e){retry();return;}
  ws=s;
  s.onopen=function(){opened=true;banner(false);};
  s.onmessage=function(e){
    var m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(m&&m.t==='estado'){S=m;if(screen!=='mixer')show('mixer');banner(false);render(m);}
  };
  s.onclose=function(){
    if(ws!==s)return;
    ws=null;
    if(opened){banner(true,'Reconectando…');retry();return;}
    /* nunca abriu: servidor fora do ar ou cookie recusado */
    fetch('/',{cache:'no-store'}).then(function(r){
      if(r.ok){show('pair');$('code').focus();}else{failed();}
    }).catch(failed);
  };
}
function failed(){if(screen!=='pair')banner(true,'Reconectando…');retry();}
function retry(){if(timer)return;timer=setTimeout(function(){timer=null;connect();},2000);}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&screen==='mixer'&&!(ws&&ws.readyState===1)){clearTimeout(timer);timer=null;connect();}
});
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}

/* ---------- pareamento ---------- */
function pair(code){
  $('go').disabled=true;$('perr').textContent='';
  fetch('/parear',{method:'POST',body:JSON.stringify({codigo:code})}).then(function(r){
    if(r.ok){history.replaceState(null,'',location.pathname);$('code').value='';connect();}
    else{
      $('perr').textContent=r.status===401?'Código incorreto.':r.status===429?'Muitas tentativas. Aguarde 1 minuto.':'Não foi possível conectar ('+r.status+').';
      show('pair');
    }
  }).catch(function(){show('pair');$('perr').textContent='Sem conexão com o PC.';})
  .then(function(){$('go').disabled=$('code').value.length!==6;});
}
$('code').addEventListener('input',function(){
  this.value=this.value.replace(/\D/g,'').slice(0,6);
  $('go').disabled=this.value.length!==6;
});
$('code').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.length===6)pair(this.value);});
$('go').addEventListener('click',function(){pair($('code').value);});

/* ---------- sliders: 1 mensagem a cada 50 ms, valor final ao soltar, ignora o estado por 500 ms ---------- */
function bindSlider(el,id,out,mk){
  function emit(final){
    var v=+el.value;out.textContent=v;
    pend[id]=v;
    var now=Date.now(),wait=50-(now-(last[id]||0));
    if(final||wait<=0){flush();}
    else if(!pend[id+'#']){pend[id+'#']=setTimeout(flush,wait);}
    function flush(){clearTimeout(pend[id+'#']);pend[id+'#']=0;last[id]=Date.now();if(pend[id]!=null){send(mk(pend[id]));pend[id]=null;}}
  }
  function release(){hold[id]=Date.now()+500;setTimeout(function(){if(S)render(S);},520);}
  el.addEventListener('pointerdown',function(){hold[id]=Infinity;});
  el.addEventListener('input',function(){if(hold[id]!==Infinity)hold[id]=Date.now()+500;emit(false);});
  el.addEventListener('change',function(){emit(true);release();});
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
}
function held(id){return hold[id]!==undefined&&Date.now()<hold[id];}
function setSlider(el,out,id,v){if(held(id))return;if(+el.value!==v)el.value=v;out.textContent=v;}

/* ---------- desenho ---------- */
function muteIcon(b,muted){b.textContent=muted?'🔇':'🔊';b.classList.toggle('muted',muted);b.setAttribute('aria-pressed',muted);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

function render(s){
  /* saídas */
  var os=JSON.stringify(s.saidas);
  if(sig.outs!==os){
    sig.outs=os;var o=$('outs');o.textContent='';
    s.saidas.forEach(function(d){
      var b=el('button',d.ativa?'on':'');b.setAttribute('aria-label',d.nome);b.setAttribute('aria-pressed',d.ativa);
      b.appendChild(el('span','g',G[d.glifo]||'🔊'));b.appendChild(el('span','n',d.nome));
      b.onclick=function(){send({t:'padrao',id:d.id});};
      o.appendChild(b);
    });
  }
  /* geral */
  var g=s.geral,ms=$('ms'),mm=$('mm');
  $('master').classList.toggle('off',!g.disponivel);
  ms.disabled=mm.disabled=!g.disponivel;
  setSlider(ms,$('mv'),'g',g.volume);muteIcon(mm,g.mudo);
  /* apps */
  var box=$('apps'),seen={};
  s.apps.forEach(function(a,i){
    seen[a.chave]=1;
    var r=rows[a.chave];
    if(!r)r=rows[a.chave]=makeRow(a);
    r.name.textContent=a.nome;
    setSlider(r.sl,r.val,a.chave,a.volume);
    r.mute.hidden=r.line.hidden=!!a.soMidia;
    if(!a.soMidia)muteIcon(r.mute,a.mudo);
    mediaRow(r,a);
    r.mute.setAttribute('aria-label','Mudo: '+a.nome);r.sl.setAttribute('aria-label','Volume de '+a.nome);
    var rs=JSON.stringify(a.rotas);
    if(r.sig!==rs){
      r.sig=rs;r.routes.textContent='';r.routes.hidden=!a.rotas.length;
      a.rotas.forEach(function(d){
        var b=el('button',d.ativa?'on':'');b.setAttribute('aria-label','Enviar '+a.nome+' para '+d.nome);b.setAttribute('aria-pressed',d.ativa);
        b.appendChild(el('span','rg',G[d.glifo]||'🔊'));b.appendChild(el('span','rn',d.nome));
        b.onclick=function(){send({t:'rota',app:a.chave,id:d.id});};
        r.routes.appendChild(b);
      });
    }
    if(box.children[i]!==r.root)box.insertBefore(r.root,box.children[i]||null);
  });
  Object.keys(rows).forEach(function(k){if(!seen[k]){rows[k].root.remove();delete rows[k];}});
  $('empty').hidden=s.apps.length>0;
}
function mediaRow(r,a){
  var md=a.midia;
  r.media.hidden=!md;
  if(!md)return;
  r.prev.disabled=!md.ant;r.next.disabled=!md.prox;r.pp.disabled=!md.pp;
  r.pp.textContent=md.tocando?'⏸':'▶';
  r.pp.setAttribute('aria-label',(md.tocando?'Pausar ':'Tocar ')+a.nome);
  r.prev.setAttribute('aria-label','Faixa anterior em '+a.nome);
  r.next.setAttribute('aria-label','Próxima faixa em '+a.nome);
  r.mt.textContent=md.artista?md.titulo+' · '+md.artista:md.titulo;
}
function makeRow(a){
  var root=el('div','card'),top=el('div','top'),ico=el('span','ico'),name=el('span','name'),mute=el('button','mute');
  var img=new Image();img.alt='';img.width=img.height=32;img.className='ico';
  img.onerror=function(){img.replaceWith(ico);ico.textContent=(a.nome||'?').charAt(0).toUpperCase();};
  img.src='/icone/'+encodeURIComponent(a.icone);
  top.append(img,name,mute);
  var sl=el('input');sl.type='range';sl.min=0;sl.max=100;sl.step=1;
  var val=el('span','val'),line=el('div','sl');line.append(sl,val);
  var routes=el('div','routes');
  var media=el('div','media'),prev=el('button','','⏮'),pp=el('button',''),next=el('button','','⏭'),mt=el('span','mt');
  media.append(prev,pp,next,mt);media.hidden=true;
  root.append(top,line,routes,media);
  mute.onclick=function(){var cur=mute.classList.contains('muted');send({t:'mudo',app:a.chave,m:!cur});};
  prev.onclick=function(){send({t:'midia',app:a.chave,acao:'ant'});};
  pp.onclick=function(){send({t:'midia',app:a.chave,acao:'pp'});};
  next.onclick=function(){send({t:'midia',app:a.chave,acao:'prox'});};
  bindSlider(sl,a.chave,val,function(v){return{t:'volume',app:a.chave,v:v};});
  return{root:root,name:name,sl:sl,val:val,mute:mute,line:line,routes:routes,media:media,prev:prev,pp:pp,next:next,mt:mt,sig:null};
}
bindSlider($('ms'),'g',$('mv'),function(v){return{t:'geral',v:v};});
$('mm').onclick=function(){send({t:'geralMudo',m:!$('mm').classList.contains('muted')});};

/* ---------- partida ---------- */
var m=/^#c=(\d{6})$/.exec(location.hash);
if(m){show('pair');$('code').value=m[1];pair(m[1]);}
else{banner(true,'Conectando…');connect();}
})();
</script>
</body>
</html>
